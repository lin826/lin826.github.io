<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CSS: The color property</title>
    <style>
        h2 {
            color: rgb(0, 232, 15);
        }
    </style>
</head>
<body>
    
    <h2>Taste the rainbow!</h2>
    
    <ul>
        <li class="red">Red</li>
        <li class="orange">Orange</li>
        <li class="yellow">Yellow</li>
        <li class="green">Green</li>
        <li class="blue">Blue</li>
        <li class="indigo">Indigo</li>
        <li class="violet">Violet</li>
    </ul>
</body>
</html>
